      <rect width="358" height="46" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
      <text x="179" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">←  Kembali ke Daftar</text>
