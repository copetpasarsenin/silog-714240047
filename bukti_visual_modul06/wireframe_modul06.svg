      <text x="160" y="146" font-size="12" fill="#111827">Surabaya</text>

      <text x="16" y="174" font-size="12" fill="#6B7280">Penerima</text>
      <text x="160" y="174" font-size="12" fill="#111827">Toko Maju Jaya</text>

      <text x="16" y="198" font-size="12" fill="#6B7280">Praktikan</text>
      <text x="160" y="198" font-size="12" font-weight="bold" fill="#111827">Richard Firmansyah (714240047)</text>
    </g>

