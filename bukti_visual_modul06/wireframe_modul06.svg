      <text x="160" y="62" font-size="12" font-weight="bold" fill="#111827">Sepatu Lari Pria</text>

      <text x="16" y="90" font-size="12" fill="#6B7280">Kode &amp; Kategori</text>
      <text x="160" y="90" font-size="12" fill="#111827">BRG-001 • Alas Kaki</text>

      <text x="16" y="118" font-size="12" fill="#6B7280">Jumlah Kirim</text>
      <text x="160" y="118" font-size="12" fill="#111827">10 unit</text>

      <text x="16" y="146" font-size="12" fill="#6B7280">Total Nilai</text>
      <text x="160" y="146" font-size="12" font-weight="bold" fill="#111827">Rp4500000</text>
